name: Bright

on:
  pull_request:
    branches:
      - '**'

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application
        run: |
          docker compose up --wait
        env:
          MYSQL_DATABASE: dvna
          MYSQL_PASSWORD: passw0rd
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: dvna

      - name: Wait for application to be ready
        run: |
          for i in {1..30}; do nc -z 127.0.0.1 9090 && exit 0 || sleep 5; done; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install SecTesterJS dependencies
        run: |
          npm i --save=false --prefix .brightsec \
            @sectester/core@0.49.0 \
            @sectester/repeater@0.49.0 \
            @sectester/scan@0.49.0 \
            @sectester/runner@0.49.0 \
            @sectester/reporter@0.49.0

      - name: Authenticate with Bright
        uses: ./.github/workflows/composite/configure-bright-credentials
        with:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: 2tiBS9X13Ps5BkKzBdbWgj
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}

      - name: Run security tests
        run: |
          node --experimental-transform-types \
            --experimental-strip-types \
            --experimental-detect-module \
            --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            --disable-warning=ExperimentalWarning \
            --test-force-exit \
            --test-concurrency=4 \
            --test .brightsec/tests/*.test.ts
        env:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: 2tiBS9X13Ps5BkKzBdbWgj
          BRIGHT_AUTH_ID: qgcpDeHpD8L8656LpBCFjW
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ env.BRIGHT_TOKEN }}
          BRIGHT_TARGET_URL: http://127.0.0.1:9090
          SECTESTER_SCAN_POOL_SIZE: ${{ vars.SECTESTER_SCAN_POOL_SIZE }}